{{- $url := urls.Parse .Destination -}}
{{- $src := .Destination -}}
{{- if not $url.IsAbs -}}
  {{- with .Page.Resources.Get $url.Path -}}{{- $src = .RelPermalink -}}{{- else -}}{{- errorf "Image %q was not found in the bundle for %s" $.Destination $.Page.File.Path -}}{{- end -}}
{{- end -}}
<img src="{{ $src }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
